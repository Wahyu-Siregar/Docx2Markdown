<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Glass Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020307"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- DOCX Card Gradient -->
    <linearGradient id="docxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Word Accent Gradient -->
    <linearGradient id="wordAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Markdown Accent Gradient -->
    <linearGradient id="mdAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.4" filter="url(#softGlow)"/>

  <!-- Main Squircle Card Frame -->
  <rect x="48" y="48" width="416" height="416" rx="88" fill="url(#docxGrad)" stroke="#334155" stroke-width="2" filter="url(#dropShadow)"/>

  <!-- Left: DOCX Document Card -->
  <g transform="translate(90, 130)">
    <!-- Paper Sheet -->
    <path d="M12 0 H95 L135 40 V195 C135 206 126 215 115 215 H12 C1 215 -8 206 -8 195 V20 C-8 9 1 0 12 0 Z" fill="#1e293b" stroke="#475569" stroke-width="3.5"/>
    <!-- Folded Ear -->
    <path d="M95 0 V40 H135 Z" fill="#334155" stroke="#475569" stroke-width="2.5"/>
    
    <!-- Document Text Skeleton Lines -->
    <rect x="15" y="60" width="75" height="10" rx="5" fill="#38bdf8"/>
    <rect x="15" y="85" width="95" height="7" rx="3.5" fill="#64748b"/>
    <rect x="15" y="104" width="85" height="7" rx="3.5" fill="#64748b"/>
    <rect x="15" y="123" width="65" height="7" rx="3.5" fill="#64748b"/>
    <rect x="15" y="142" width="90" height="7" rx="3.5" fill="#64748b"/>

    <!-- DOCX Emblem Pill -->
    <rect x="5" y="172" width="64" height="24" rx="7" fill="url(#wordAccent)"/>
    <text x="37" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DOCX</text>
  </g>

  <!-- Center Transformation Flow Node -->
  <g transform="translate(236, 236)">
    <circle cx="20" cy="20" r="28" fill="url(#borderGrad)" filter="url(#softGlow)"/>
    <path d="M11 20 H29 M22 13 L29 20 L22 27" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: Markdown Document Card -->
  <g transform="translate(282, 130)">
    <!-- Paper Sheet -->
    <path d="M12 0 H95 L135 40 V195 C135 206 126 215 115 215 H12 C1 215 -8 206 -8 195 V20 C-8 9 1 0 12 0 Z" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="3.5"/>
    <!-- Folded Ear -->
    <path d="M95 0 V40 H135 Z" fill="#1e293b" stroke="#6366f1" stroke-width="2.5"/>

    <!-- Minimalist Markdown M Symbol -->
    <path d="M18 135 V75 L42 105 L66 75 V135" fill="none" stroke="url(#borderGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Markdown Arrow Indicator -->
    <path d="M102 75 V122 M88 107 L102 122 L116 107" fill="none" stroke="#a855f7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- MD Emblem Pill -->
    <rect x="62" y="172" width="64" height="24" rx="7" fill="url(#mdAccent)"/>
    <text x="94" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">.MD</text>
  </g>
</svg>
